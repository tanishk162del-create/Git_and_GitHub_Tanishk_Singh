<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask & MongoDB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Submit Data</h1>
    <p class="subtitle">Flask frontend with MongoDB Atlas</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('index') }}">
      <label for="name">Name</label>
      <input id="name" name="name" value="{{ form.get('name', '') }}" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required>{{ form.get('message', '') }}</textarea>

      <button type="submit">Submit</button>
    </form>

    <a class="api-link" href="{{ url_for('api') }}">View /api JSON</a>
  </main>
  <p><a href="{{ url_for('todo_page') }}">Open To-Do List</a></p>
</body>
</html>
