<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>To-Do List</h1>
        <p>Add a new item to your task list.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('submit_todo_item') }}" method="POST">
            <label for="itemId">Item ID</label>
            <input
                type="number"
                id="itemId"
                name="itemId"
                placeholder="Enter item ID"
                required
            >
            <label for="itemUuid">Item UUID</label>
            <input
                type="text"
                id="itemUuid"
                name="itemUuid"
                placeholder="Enter item UUID"
                required
            >
            <label for="itemHash">Item Hash</label>
            <input
                type="text"
                id="itemHash"
                name="itemHash"
                placeholder="Enter item hash"
                required
            >

            <label for="itemName">Item Name</label>
            <input
                type="text"
                id="itemName"
                name="itemName"
                placeholder="Enter item name"
                required
            >

            <label for="itemDescription">Item Description</label>
            <textarea
                id="itemDescription"
                name="itemDescription"
                placeholder="Describe your task"
                rows="5"
                required
            ></textarea>

            <button type="submit">Add To-Do Item</button>
        </form>

        <p><a href="{{ url_for('index') }}">Back to Home</a></p>
    </main>
</body>
</html>
